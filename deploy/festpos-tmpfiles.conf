d /run/festpos/zeit-neu      0700 festpos festpos -
d /run/festpos/zeit-ergebnis 0755 root    root    -
d /run/festpos/update         0700 festpos festpos -
d /run/festpos/update-neu     0700 festpos festpos -
d /run/festpos/update-status  0755 root    root    -
d /run/festpos/update-netz    0700 festpos festpos -
d /run/festpos/firewall       0700 festpos festpos -
d /run/festpos/firewall-stand 0755 root    root    -
