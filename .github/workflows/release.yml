# FestPOS – Release zu einem Tag vX.Y.Z (Testversion: vX.Y.Z-rc.N): alles prüfen, dann Update-Paket, Image und
# Android-App bauen und einen Release-ENTWURF mit allen Dateien anlegen. Veröffentlicht wird von Hand, erst nachdem
# festpos.zip signiert und festpos.zip.sig angehängt ist (die CI hat keinen Update-Schlüssel). Testversionen werden
# als «Pre-release» angelegt: «Update aus dem Internet» und der Imager (releases/latest) nehmen sie nie.

name: Release
on:
  push:
    tags: ["v*"]

# Actions sind auf Commit-Nummern festgelegt (Review 2026-11, D4): ein verschobenes Tag «v4» bringt so keinen fremden
# Code in den Bau. Erneuern: git ls-remote https://github.com/<action> 'refs/tags/v4' 'refs/tags/v4^{}'
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    uses: ./.github/workflows/ci.yml

  zip:
    needs: pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.13"
      - name: Tag und VERSION stimmen überein, Format gültig
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME, VERSION $v"; exit 1; }
          python3 -c "import sys; sys.path.insert(0, '.'); from app.release import version_key; sys.exit(0 if version_key('$v') and version_key('$v')[0] == 1 else 1)"
      - name: Projekt-Schlüssel vorhanden (sonst nähmen Pi aus dem Image keine Updates an)
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from app.release import parse_key_line; \
          k = parse_key_line(open('deploy/festpos-update-projekt.pub').read()); print('Projekt-Schlüssel', k.fp)"
      - name: Sicherheitsupdates des Betriebssystems holen (T-0-N/FestPOS#5, nur mit deploy/os-pakete.txt)
        if: hashFiles('deploy/os-pakete.txt') != ''
        run: |
          sudo apt-get install -y -q debian-archive-keyring
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key | gpg --dearmor > "$RUNNER_TEMP/rpi.gpg"
          # genau ein Hauptschlüssel, und zwar der bekannte (Fingerabdrücke von Unterschlüsseln zählen nicht)
          fp=$(gpg --show-keys --with-colons "$RUNNER_TEMP/rpi.gpg" | awk -F: '/^pub/ {p=1; next} /^sub/ {p=0} p && /^fpr/ {print $10; p=0}')
          test "$fp" = "$RPI_KEY_FP" || { echo "::error::Unerwartete Schlüssel von Raspberry Pi: $fp"; exit 1; }
          python3 tools/os_updates.py --pakete deploy/os-pakete.txt --ziel dist/os-updates \
            --debian-keyring /usr/share/keyrings/debian-archive-keyring.gpg --rpi-keyring "$RUNNER_TEMP/rpi.gpg"
        env:
          RPI_KEY_FP: CF8A1AF502A2AA2D763BAE7E82B129927FA3303E   # Raspberry Pi Archive Signing Key
      - name: festpos.zip bauen (Python-Pakete und rqlite mit Prüfsumme)
        run: |
          if [ -d dist/os-updates ]; then python tools/build_zip.py --os-updates dist/os-updates
          else python tools/build_zip.py; fi
      - name: Aufbau wie auf dem Pi prüfen
        run: python -c "import sys; sys.path.insert(0, '.'); from app.release import inspect_zip; print(inspect_zip('dist/festpos.zip'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: festpos-zip
          path: dist/festpos.zip
          retention-days: 14

  apk:
    needs: pruefen
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  image:
    needs: pruefen
    uses: ./.github/workflows/image.yml

  entwurf:
    needs: [zip, apk, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write          # Herkunftsnachweis (Sigstore, OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          path: out
          merge-multiple: true
      - name: Paketliste (SBOM, CycloneDX) für Update-Paket und Image
        run: |
          python3 tools/sbom.py zip > out/festpos.zip.cdx.json
          img=$(ls out/festpos-*.img.xz | head -1)
          if [ -f out/festpos-pakete.txt ] && [ -n "$img" ]; then
            python3 tools/sbom.py image out/festpos-pakete.txt > "$img.cdx.json"
            # bleibt im Entwurf: release.ps1 übernimmt sie als deploy/os-pakete.txt (Updates des Betriebssystems, #5)
          else
            echo "::warning::Paketliste des Images fehlt – SBOM nur für festpos.zip"
          fi
      - name: Herkunftsnachweis (gh attestation verify DATEI -R T-0-N/FestPOS)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f   # v3.2.0
        with:
          subject-path: |
            out/festpos.zip
            out/festpos-*.img.xz
            out/*.apk
            out/*.cdx.json
      - name: Prüfsummen und Release-Text
        run: |
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          python3 tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Release-Entwurf anlegen (veröffentlicht wird von Hand, nach dem Signieren)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-rc.*) pre="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft $pre --verify-tag --title "FestPOS ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --clobber
          echo "::notice::Entwurf $TAG angelegt: festpos.zip herunterladen, signieren, festpos.zip.sig anhängen, dann veröffentlichen"
