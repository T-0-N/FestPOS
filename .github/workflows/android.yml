# FestPOS Tap (T13): Begleit-App für die NFC-Zahlung über Payrexx (PAYREXX-UNGETESTET). Baut die APK bei Änderungen
# unter android/ als Artefakt; zu einem Release-Tag ruft es release.yml auf (Anhang festpos-tap.apk). Signiert mit dem
# Schlüssel aus den Secrets
# FESTPOS_TAP_KEYSTORE_B64 (Base64 des Keystores), FESTPOS_TAP_KEYSTORE_PASSWORD, FESTPOS_TAP_KEY_ALIAS,
# FESTPOS_TAP_KEY_PASSWORD – ohne sie mit dem Debug-Schlüssel (nur zum Testen; ein Update verlangt dann Neuinstallation).
name: Android
on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

# Actions sind auf Commit-Nummern festgelegt (Review 2026-11, D4): ein verschobenes Tag «v4» bringt so keinen fremden
# Code in den Bau. Erneuern: git ls-remote https://github.com/<action> 'refs/tags/v4' 'refs/tags/v4^{}'
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04            # Android-SDK ist auf dem Runner vorinstalliert
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c   # v6.4.1
        with:
          gradle-version: "8.9"
      - name: Schlüssel (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.FESTPOS_TAP_KEYSTORE_B64 }}
          RELEASE: ${{ inputs.release && '1' || '' }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tap.jks"
            echo "FESTPOS_TAP_KEYSTORE=$RUNNER_TEMP/tap.jks" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE" ]; then
            echo "::error::Release ohne Signierschlüssel (Secrets FESTPOS_TAP_*): installierte Apps liessen sich nicht aktualisieren"
            exit 1
          fi
      - name: APK bauen
        env:
          FESTPOS_TAP_KEYSTORE_PASSWORD: ${{ secrets.FESTPOS_TAP_KEYSTORE_PASSWORD }}
          FESTPOS_TAP_KEY_ALIAS: ${{ secrets.FESTPOS_TAP_KEY_ALIAS }}
          FESTPOS_TAP_KEY_PASSWORD: ${{ secrets.FESTPOS_TAP_KEY_PASSWORD }}
        run: |
          gradle -p android/festpos-tap assembleRelease --no-daemon
          mkdir -p out
          cp android/festpos-tap/app/build/outputs/apk/release/*.apk out/festpos-tap.apk
          (cd out && sha256sum festpos-tap.apk > festpos-tap.apk.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: festpos-tap
          path: out/
          retention-days: 14
