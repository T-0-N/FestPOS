# FestPOS – fertiges Image für den Raspberry Pi Imager (T12): pi-gen baut Raspberry Pi OS Lite mit FestPOS
# (festpos-<VERSION>.img.xz, .sha256, festpos-os-list.json) als Artefakt. Zu einem Release-Tag ruft es release.yml auf
# und hängt die Dateien an den Release-Entwurf; von Hand (Actions › Image › Run workflow) für ein Test-Image.
name: Image
on:
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: "pi-gen Zweig/Tag"
        default: "arm64"
      runner:
        description: "Runner (ARM: schnell, gratis bei öffentlichen Repos; x86: mit QEMU, 1,5–3 h)"
        type: choice
        options: ["ubuntu-24.04-arm", "ubuntu-24.04"]
        default: "ubuntu-24.04-arm"
  workflow_call:
    inputs:
      pi_gen_ref:
        type: string
        default: "arm64"
      runner:
        type: string
        default: "ubuntu-24.04-arm"

# Actions sind auf Commit-Nummern festgelegt (Review 2026-11, D4): ein verschobenes Tag «v4» bringt so keinen fremden
# Code in den Bau. Erneuern: git ls-remote https://github.com/<action> 'refs/tags/v4' 'refs/tags/v4^{}'
permissions:
  contents: read

jobs:
  image:
    # ARM-Runner: pi-gen baut ohne Emulation (etwa 30–60 min). Höchstdauer eines Jobs auf GitHub: 6 h.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: QEMU für arm64 (nur auf einem x86-Runner)
        if: runner.arch != 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64
      - name: Platz schaffen (das Image braucht viel Platz)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Image bauen (pi-gen, Docker; Python-Pakete und rqlite mit Prüfsumme)
        env:
          PI_GEN_REF: ${{ inputs.pi_gen_ref || 'arm64' }}
          FESTPOS_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bash deploy/pi-gen/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: festpos-image
          path: deploy/pi-gen/out/
          retention-days: 7
